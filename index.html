<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuộc thi Trực tuyến | Cải cách hành chính & Chuyển đổi số xã Mỏ Cày 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Exam Success Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        let currentUser = null;
        let gasApiUrl = 'https://script.google.com/macros/s/AKfycbyBK2jtG5vfgBJvjGqfI92Pd0OQaLvlDTNGZI82NSR1m24SxnT1WXcvb4nUb9lF0IKz/exec';
        let timerInterval = null;
        
        // ⏱️ TÙY CHỈNH THỜI GIAN THI (Đơn vị: Giây)
        const TOTAL_EXAM_SECONDS = 600; // 600 = 10 phút

        // 📅 TÙY CHỈNH THỜI GIAN MỞ & KẾT THÚC CUỘC THI TẠI ĐÂY
        // Định dạng: "YYYY-MM-DDTHH:mm:ss" (Năm-Tháng-NgàyTHi:Phút:Giây)
        const CONTEST_START_DATE = "2026-08-15T00:00:00"; // Ngày bắt đầu (Ví dụ: 00h00 ngày 15/08/2026)
        const CONTEST_END_DATE   = "2026-08-31T23:59:59"; // Ngày kết thúc (Ví dụ: 23h59 ngày 31/08/2026)
        
        let examTimeLeft = TOTAL_EXAM_SECONDS;
        let currentQuestionIdx = 0;
        let userAnswers = {};
        let flaggedQuestions = {};
        let activeQuestions = []; // Lưu 20 câu ngẫu nhiên được chọn cho lượt thi này
        let pendingAction = null; // Dùng cho Modal Xác nhận tùy biến

        window.onload = function() {
            initCountdown();
            loadUserSession();
            updateRealStats();
            setInterval(updateRealStats, 20000); // Tự động cập nhật số liệu mỗi 20 giây
            
            const localGasUrl = localStorage.getItem('gas_api_url');
            if(localGasUrl) gasApiUrl = localGasUrl;
            if(document.getElementById('gasApiUrlInput')) {
                document.getElementById('gasApiUrlInput').value = gasApiUrl;
            }
        };

        function updateRealStats() {
            let registeredUsers = [];
            let examLogs = [];
            try {
                registeredUsers = JSON.parse(localStorage.getItem('cds_registered_users')) || [];
            } catch(e) { registeredUsers = []; }
            try {
                examLogs = JSON.parse(localStorage.getItem('cds_exam_logs')) || [];
            } catch(e) { examLogs = []; }

            let totalUsers = registeredUsers.length;
            let totalAttempts = registeredUsers.reduce((sum, u) => sum + (u.attempts || 0), 0);
            let completedExams = examLogs.length;
            let totalScore = examLogs.reduce((sum, e) => sum + (e.score || 0), 0);
            let avgScore = completedExams > 0 ? (totalScore / completedExams).toFixed(1) : "0.0";
            
            let onlineBase = Math.max(1, Math.floor(totalUsers * 0.15) + Math.floor(Math.random() * 5));

            if (gasApiUrl && gasApiUrl.startsWith('http')) {
                fetch(`${gasApiUrl}?action=getStats`)
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') {
                            animateNumber('statUsers', res.users || totalUsers);
                            animateNumber('statAttempts', res.attempts || totalAttempts);
                            animateNumber('statCompleted', res.completed || completedExams);
                            const avgEl = document.getElementById('statAvgScore');
                            if (avgEl) avgEl.innerHTML = `${res.avgScore || avgScore} <span class="text-xs font-normal text-slate-400">/20</span>`;
                            animateNumber('statOnline', res.online || onlineBase);
                        } else {
                            renderLocalStats(totalUsers, totalAttempts, completedExams, avgScore, onlineBase);
                        }
                    })
                    .catch(() => {
                        renderLocalStats(totalUsers, totalAttempts, completedExams, avgScore, onlineBase);
                    });
            } else {
                renderLocalStats(totalUsers, totalAttempts, completedExams, avgScore, onlineBase);
            }
        }

        function renderLocalStats(users, attempts, completed, avg, online) {
            animateNumber('statUsers', users);
            animateNumber('statAttempts', attempts);
            animateNumber('statCompleted', completed);
            const avgEl = document.getElementById('statAvgScore');
            if (avgEl) avgEl.innerHTML = `${avg} <span class="text-xs font-normal text-slate-400">/20</span>`;
            animateNumber('statOnline', online);
        }

        function animateNumber(elementId, targetVal) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const currentVal = parseInt(el.innerText) || 0;
            if (currentVal === targetVal) {
                if (el) el.innerText = targetVal;
                return;
            }
            let start = currentVal;
            let step = Math.ceil(Math.abs(targetVal - start) / 10) || 1;
            let timer = setInterval(() => {
                if (start < targetVal) {
                    start += step;
                    if (start >= targetVal) { start = targetVal; clearInterval(timer); }
                } else {
                    start -= step;
                    if (start <= targetVal) { start = targetVal; clearInterval(timer); }
                }
                const currentEl = document.getElementById(elementId);
                if (currentEl) currentEl.innerText = start;
                else clearInterval(timer);
            }, 30);
        }

        function loadUserSession() {
            const saved = localStorage.getItem('cds_user');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    updateUserUI();
                } catch(e) {
                    localStorage.removeItem('cds_user');
                }
            }
        }

        function updateUserUI() {
            const userArea = document.getElementById('navUserArea');
            if (!userArea) return;

            if (currentUser) {
                const attempts = currentUser.attempts || 0;
                userArea.innerHTML = `
                    <div class="flex items-center space-x-3 bg-blue-50 border border-blue-200 px-3.5 py-1.5 rounded-xl text-xs">
                        <div class="w-8 h-8 rounded-full bg-gov text-white flex items-center justify-center font-bold">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="text-left">
                            <span class="block font-bold text-gov text-xs leading-tight">${currentUser.name}</span>
                            <span class="text-[10px] text-slate-500">Đã thi: <strong class="text-orange-600">${attempts}/2</strong> lượt</span>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="border border-slate-300 text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-xl text-xs font-semibold transition-all" title="Đăng xuất">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i>Thoát
                    </button>
                `;
            } else {
                userArea.innerHTML = `
                    <button onclick="toggleModal('loginModal')" class="border border-gov text-gov hover:bg-blue-50 px-4 py-2 rounded-xl text-sm font-semibold transition-all">
                        <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Đăng nhập
                    </button>
                    <button onclick="toggleModal('registerModal')" class="bg-cta hover:bg-cta-hover text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg shadow-orange-500/30 hover:scale-105 transition-all">
                        <i class="fa-solid fa-user-plus mr-1.5"></i>Đăng ký
                    </button>
                `;
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('cds_user');
            updateUserUI();
            showToast("Đã đăng xuất tài khoản!");
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.toggle('hidden');
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            if (toastMsg) toastMsg.innerText = msg;
            if (toast) toast.classList.remove('hidden');
            setTimeout(() => { 
                if (toast) toast.classList.add('hidden'); 
            }, 3500);
        }

        function initCountdown() {
            const startDate = new Date(CONTEST_START_DATE).getTime();
            const endDate = new Date(CONTEST_END_DATE).getTime();

            setInterval(() => {
                const now = new Date().getTime();
                let targetDate = startDate;
                let labelText = "Thời gian đếm ngược đến lúc mở cổng thi";

                if (now >= startDate) {
                    targetDate = endDate;
                    labelText = "Thời gian còn lại của cuộc thi";
                }

                const cdLabel = document.getElementById('cdLabel');
                if (cdLabel) cdLabel.innerText = labelText;

                const diff = targetDate - now;

                const dEl = document.getElementById('cdDays');
                const hEl = document.getElementById('cdHours');
                const mEl = document.getElementById('cdMinutes');
                const sEl = document.getElementById('cdSeconds');

                if (diff > 0) {
                    if (dEl) dEl.innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                    if (hEl) hEl.innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                    if (mEl) mEl.innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                    if (sEl) sEl.innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
                } else {
                    if (dEl) dEl.innerText = "00";
                    if (hEl) hEl.innerText = "00";
                    if (mEl) mEl.innerText = "00";
                    if (sEl) sEl.innerText = "00";
                }
            }, 1000);
        }

        function toggleFaq(index) {
            const ans = document.getElementById(`faqAnswer${index}`);
            const icon = document.getElementById(`faqIcon${index}`);
            if (ans) ans.classList.toggle('hidden');
            if (icon) icon.classList.toggle('rotate-180');
        }

        function initCountdown() {
            const startDate = new Date(CONTEST_START_DATE).getTime();
            const endDate = new Date(CONTEST_END_DATE).getTime();

            setInterval(() => {
                const now = new Date().getTime();
                let targetDate = startDate;
                let labelText = "Thời gian đếm ngược đến lúc mở cổng thi";

                if (now >= startDate) {
                    targetDate = endDate;
                    labelText = "Thời gian còn lại của cuộc thi";
                }

                const cdLabel = document.getElementById('cdLabel');
                if (cdLabel) cdLabel.innerText = labelText;

                const diff = targetDate - now;

                const dEl = document.getElementById('cdDays');
                const hEl = document.getElementById('cdHours');
                const mEl = document.getElementById('cdMinutes');
                const sEl = document.getElementById('cdSeconds');

                if (diff > 0) {
                    if (dEl) dEl.innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                    if (hEl) hEl.innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                    if (mEl) mEl.innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                    if (sEl) sEl.innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
                } else {
                    if (dEl) dEl.innerText = "00";
                    if (hEl) hEl.innerText = "00";
                    if (mEl) mEl.innerText = "00";
                    if (sEl) sEl.innerText = "00";
                }
            }, 1000);
        }

        function toggleFaq(index) {
            document.getElementById(`faqAnswer${index}`).classList.toggle('hidden');
            document.getElementById(`faqIcon${index}`).classList.toggle('rotate-180');
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const pass = document.getElementById('regPass').value;
            const passConfirm = document.getElementById('regPassConfirm').value;

            if (pass !== passConfirm) {
                showToast("Mật khẩu xác nhận không khớp!");
                return;
            }

            const name = document.getElementById('regName').value;
            const dob = document.getElementById('regDob') ? document.getElementById('regDob').value : '';
            const cccd = document.getElementById('regCccd') ? document.getElementById('regCccd').value : '';
            const village = document.getElementById('regVillage').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail') ? document.getElementById('regEmail').value : '';

            let registeredUsers = [];
            try {
                registeredUsers = JSON.parse(localStorage.getItem('cds_registered_users')) || [];
            } catch(err) { registeredUsers = []; }

            const existingUser = registeredUsers.find(u => (u.phone && u.phone === phone) || (u.cccd && u.cccd === cccd));
            if (existingUser) {
                showToast("Số điện thoại hoặc CCCD này đã được đăng ký! Vui lòng Đăng nhập.");
                toggleModal('registerModal');
                toggleModal('loginModal');
                return;
            }

            const newUser = { name, dob, cccd, village, phone, email, pass, attempts: 0 };
            registeredUsers.push(newUser);
            localStorage.setItem('cds_registered_users', JSON.stringify(registeredUsers));

            currentUser = newUser;
            localStorage.setItem('cds_user', JSON.stringify(currentUser));
            updateUserUI();
            updateRealStats();

            if (gasApiUrl && gasApiUrl.startsWith('http')) {
                fetch(gasApiUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', ...newUser, password: pass })
                }).catch(err => console.error("Error posting to GAS:", err));
            }

            toggleModal('registerModal');
            showToast(`Đăng ký thành công! Chào mừng ${currentUser.name}. Hãy nhấn 'BẮT ĐẦU THI NGAY' để làm bài.`);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const userKey = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            let registeredUsers = [];
            try {
                registeredUsers = JSON.parse(localStorage.getItem('cds_registered_users')) || [];
            } catch(err) { registeredUsers = []; }

            const foundUser = registeredUsers.find(u => 
                (u.phone && u.phone === userKey) || (u.cccd && u.cccd === userKey)
            );

            if (!foundUser) {
                showToast("Tài khoản chưa được đăng ký trên hệ thống! Vui lòng Đăng ký.");
                return;
            }

            if (foundUser.pass && foundUser.pass !== pass) {
                showToast("Mật khẩu không chính xác! Vui lòng kiểm tra lại.");
                return;
            }

            currentUser = foundUser;
            localStorage.setItem('cds_user', JSON.stringify(currentUser));
            updateUserUI();
            toggleModal('loginModal');
            showToast(`Đăng nhập thành công! Chào mừng ${currentUser.name}.`);
        }

        function startExamFlow() {
            if (!currentUser) {
                showToast("Vui lòng Đăng ký hoặc Đăng nhập trước!");
                toggleModal('loginModal');
                return;
            }

            const attempts = currentUser.attempts || 0;
            if (attempts >= 2) {
                showToast("Bạn đã hoàn thành tối đa 02/02 lượt thi theo quy định!");
                return;
            }

            if (!questionBank || questionBank.length === 0) {
                showToast("Ngân hàng câu hỏi chưa sẵn sàng!");
                return;
            }

            // Xáo trộn ngẫu nhiên toàn bộ bộ 100 câu hỏi và chọn ra 20 câu duy nhất
            const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            activeQuestions = shuffled.slice(0, Math.min(20, questionBank.length));

            currentQuestionIdx = 0;
            userAnswers = {};
            flaggedQuestions = {};
            
            // Đặt thời gian làm bài theo hằng số TOTAL_EXAM_SECONDS
            examTimeLeft = TOTAL_EXAM_SECONDS;

            document.getElementById('examCandidateName').innerText = `Thí sinh: ${currentUser.name}`;
            document.getElementById('examCandidateUnit').innerText = `Đơn vị: ${currentUser.village} (Lượt thi: ${attempts + 1}/2)`;

            renderQuestionMatrix();
            loadQuestion(0);
            startExamTimer();
            toggleModal('examModal');
        }

        function renderQuestionMatrix() {
            const matrix = document.getElementById('questionMatrix');
            matrix.innerHTML = '';
            activeQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `qMatrixBtn_${idx}`;
                btn.onclick = () => loadQuestion(idx);
                btn.className = 'w-9 h-9 rounded-xl font-bold text-xs border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 transition-all';
                btn.innerText = idx + 1;
                matrix.appendChild(btn);
            });
        }

        function loadQuestion(idx) {
            currentQuestionIdx = idx;
            const q = activeQuestions[idx];

            const idxEl = document.getElementById('qCurrentIndexText');
            if (idxEl) idxEl.innerText = `Câu hỏi ${idx + 1} / ${activeQuestions.length}`;
            
            const titleEl = document.getElementById('qTitle');
            if (titleEl) titleEl.innerText = `${idx + 1}. ${q.title}`;
            
            const progressEl = document.getElementById('examProgressBar');
            if (progressEl) progressEl.style.width = `${((idx + 1) / activeQuestions.length) * 100}%`;

            const flagText = document.getElementById('flagBtnText');
            if (flagText) {
                if (flaggedQuestions[idx]) {
                    flagText.innerText = "Đã đánh dấu";
                    if (flagText.parentElement) flagText.parentElement.className = "text-xs font-bold text-yellow-600 flex items-center space-x-1";
                } else {
                    flagText.innerText = "Đánh dấu xem lại";
                    if (flagText.parentElement) flagText.parentElement.className = "text-xs font-semibold text-slate-500 hover:text-yellow-600 flex items-center space-x-1";
                }
            }

            const container = document.getElementById('qOptions');
            if (!container) return;
            container.innerHTML = '';

            q.options.forEach((opt, optIdx) => {
                const isSelected = userAnswers[idx] === optIdx;
                const optDiv = document.createElement('div');
                optDiv.onclick = () => selectOption(idx, optIdx);
                optDiv.className = `p-4 rounded-2xl border text-sm font-medium cursor-pointer flex items-center justify-between transition-all ${
                    isSelected ? 'border-gov bg-blue-50/80 text-gov font-bold shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'
                }`;
                optDiv.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-6 h-6 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-gov bg-gov text-white font-bold' : 'border-slate-300 bg-slate-100 text-slate-600'}">
                            ${String.fromCharCode(65 + optIdx)}
                        </div>
                        <span>${opt}</span>
                    </div>
                `;
                container.appendChild(optDiv);
            });
            updateMatrixStyles();
        }

        function selectOption(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
            loadQuestion(qIdx);
        }

        function navigateQuestion(dir) {
            const nextIdx = currentQuestionIdx + dir;
            if (nextIdx >= 0 && nextIdx < activeQuestions.length) loadQuestion(nextIdx);
        }

        function toggleFlagQuestion() {
            flaggedQuestions[currentQuestionIdx] = !flaggedQuestions[currentQuestionIdx];
            loadQuestion(currentQuestionIdx);
        }

        function updateMatrixStyles() {
            activeQuestions.forEach((_, idx) => {
                const btn = document.getElementById(`qMatrixBtn_${idx}`);
                if (!btn) return;
                
                let baseStyle = 'w-9 h-9 rounded-xl font-bold text-xs transition-all ';
                if (idx === currentQuestionIdx) {
                    baseStyle += 'ring-2 ring-gov ring-offset-1 ';
                }

                if (flaggedQuestions[idx]) {
                    btn.className = baseStyle + 'bg-yellow-400 text-slate-900 border-yellow-500';
                } else if (userAnswers[idx] !== undefined) {
                    btn.className = baseStyle + 'bg-gov text-white border-gov';
                } else {
                    btn.className = baseStyle + 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-100';
                }
            });
        }

        function startExamTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                examTimeLeft--;
                const mins = String(Math.floor(examTimeLeft / 60)).padStart(2, '0');
                const secs = String(examTimeLeft % 60).padStart(2, '0');
                const timerEl = document.getElementById('examTimer');
                if (timerEl) timerEl.innerText = `${mins}:${secs}`;

                if (examTimeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishExam();
                }
            }, 1000);
        }

        function openConfirmDialog(action) {
            pendingAction = action;
            const modal = document.getElementById('confirmModal');
            const title = document.getElementById('confirmTitle');
            const msg = document.getElementById('confirmMessage');
            const actionBtn = document.getElementById('confirmActionBtn');

            if (!modal || !title || !msg || !actionBtn) {
                if (action === 'submit') {
                    clearInterval(timerInterval);
                    finishExam();
                } else if (action === 'exit') {
                    clearInterval(timerInterval);
                    toggleModal('examModal');
                }
                return;
            }

            if (action === 'exit') {
                title.innerText = "Thoát bài thi?";
                msg.innerText = "Kết quả bài thi sẽ không được lưu. Bạn có chắc chắn muốn thoát?";
                actionBtn.innerText = "Thoát bài thi";
                actionBtn.className = "flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow-md transition-all";
                actionBtn.onclick = () => {
                    closeConfirmDialog();
                    clearInterval(timerInterval);
                    toggleModal('examModal');
                };
            } else if (action === 'submit') {
                const answeredCount = Object.keys(userAnswers).length;
                title.innerText = "Xác nhận nộp bài thi?";
                msg.innerText = `Bạn đã làm ${answeredCount}/${activeQuestions.length} câu hỏi. Bạn có chắc chắn muốn nộp bài thi ngay bây giờ?`;
                actionBtn.innerText = "Nộp bài ngay";
                actionBtn.className = "flex-1 py-2.5 bg-cta hover:bg-cta-hover text-white font-bold text-xs rounded-xl shadow-md transition-all";
                actionBtn.onclick = () => {
                    closeConfirmDialog();
                    clearInterval(timerInterval);
                    finishExam();
                };
            }
            modal.classList.remove('hidden');
        }

        function closeConfirmDialog() {
            const modal = document.getElementById('confirmModal');
            if (modal) modal.classList.add('hidden');
        }

        function finishExam() {
            let correctCount = 0;
            activeQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) correctCount++;
            });

            const durationSeconds = TOTAL_EXAM_SECONDS - examTimeLeft;

            currentUser.attempts = (currentUser.attempts || 0) + 1;
            localStorage.setItem('cds_user', JSON.stringify(currentUser));

            try {
                let examLogs = JSON.parse(localStorage.getItem('cds_exam_logs')) || [];
                examLogs.push({
                    userKey: currentUser.phone || currentUser.cccd,
                    name: currentUser.name,
                    score: correctCount,
                    durationSeconds: durationSeconds,
                    date: new Date().toLocaleDateString('vi-VN')
                });
                localStorage.setItem('cds_exam_logs', JSON.stringify(examLogs));
            } catch(e) {}

            try {
                let registeredUsers = JSON.parse(localStorage.getItem('cds_registered_users')) || [];
                const idx = registeredUsers.findIndex(u => (u.phone && u.phone === currentUser.phone) || (u.cccd && u.cccd === currentUser.cccd));
                if (idx !== -1) {
                    registeredUsers[idx].attempts = currentUser.attempts;
                    localStorage.setItem('cds_registered_users', JSON.stringify(registeredUsers));
                }
            } catch(err) {}

            updateUserUI();
            updateRealStats();

            const resScore = document.getElementById('resScoreText');
            if (resScore) resScore.innerText = `${correctCount}/${activeQuestions.length}`;
            
            const resCorrect = document.getElementById('resCorrectText');
            if (resCorrect) resCorrect.innerText = correctCount;
            
            const resTime = document.getElementById('resTimeText');
            if (resTime) resTime.innerText = `${Math.floor(durationSeconds / 60)}:${String(durationSeconds % 60).padStart(2, '0')}`;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            if (gasApiUrl && gasApiUrl.startsWith('http')) {
                fetch(gasApiUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'submitExam',
                        userKey: currentUser.phone || currentUser.cccd,
                        name: currentUser.name,
                        village: currentUser.village,
                        score: correctCount,
                        correctCount: correctCount,
                        durationSeconds: durationSeconds
                    })
                }).catch(err => console.error("Error submitting exam to GAS:", err));
            }

            toggleModal('examModal');
            toggleModal('resultModal');
        }

        function saveGasUrl() {
            const url = document.getElementById('gasApiUrlInput').value.trim();
            localStorage.setItem('gas_api_url', url);
            gasApiUrl = url;
            showToast("Đã lưu URL kết nối Google Apps Script!");
            toggleModal('gasConfigModal');
        }
    </script>
</body>
</html>
